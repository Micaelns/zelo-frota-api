receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:
      paging:

processors:
  batch:

exporters:

  debug:
    verbosity: detailed
    
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  prometheus:
    endpoint: "0.0.0.0:9464"

  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]

    metrics:
      receivers: 
        - otlp
        - hostmetrics
      processors: [batch]
      exporters: [debug, prometheus]